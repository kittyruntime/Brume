name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish (ex: v1.0.0)"
        required: true

env:
  APP_NAME: hsi

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.version }}

      - name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          }
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm verify

      - name: Assemble locked runtime dependencies
        run: |
          npm ci --prefix runtime --omit=dev --no-audit --no-fund
          PRISMA_CLI_BINARY_TARGETS=debian-openssl-3.0.x \
            node runtime/node_modules/@prisma/engines/scripts/postinstall.js
          test -x runtime/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
          test -s runtime/node_modules/@prisma/engines/libquery_engine-debian-openssl-3.0.x.so.node

      - name: Build root-worker (linux/amd64)
        run: |
          cd apps/root-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o root-worker .

      - name: Build dashboard
        run: |
          echo "VITE_API_URL=/trpc" > apps/dashboard/.env.production
          pnpm --filter @app/dashboard run build

      - name: Package release
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          ARCHIVE="${APP_NAME}-v${VERSION}-linux-amd64.tar.gz"

          tar -czf "$ARCHIVE" \
            --transform "flags=rh;s|^apps/backend/dist/server\.js$|server.js|" \
            --transform "flags=rh;s|^apps/dashboard/dist|public|" \
            --transform "flags=rh;s|^apps/root-worker/root-worker$|bin/${APP_NAME}-root-worker|" \
            --transform "flags=rh;s|^packages/database|database|" \
            --transform "flags=rh;s|^runtime/node_modules|node_modules|" \
            --transform "flags=rh;s|^|${APP_NAME}-v${VERSION}/|" \
            apps/root-worker/root-worker \
            apps/backend/dist/server.js \
            apps/dashboard/dist \
            packages/database/package.json \
            packages/database/prisma \
            packages/database/src \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            LICENSE \
            CHANGELOG.md \
            README.md \
            runtime/package.json \
            runtime/package-lock.json \
            runtime/node_modules \
            scripts/install.sh

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract changelog notes
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "RELEASE_NOTES<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ARCHIVE }}
          body: ${{ env.RELEASE_NOTES }}
