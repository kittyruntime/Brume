name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope — CI only needs to read the repo to check out and build.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release runtime lock
        run: npm ci --prefix runtime --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Check UI strings are English
        run: scripts/check-i18n.sh

      - name: Check and vet Go
        run: pnpm check:go

      - name: Typecheck
        run: pnpm typecheck

      - name: Test backend and root-worker
        run: pnpm test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build root-worker
        run: cd apps/root-worker && CGO_ENABLED=0 go build -o root-worker .

      - name: Smoke-test backend artifact
        run: pnpm smoke:backend
